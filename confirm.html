<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - ABC Cafe</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>

    <header>
        <h1>ABC Cafe</h1>
        <h2>Fresh Brews & Cozy Vibes</h2>
    </header>

    <div class="confirm">
        <div class="check">&#10003;</div>
        <h2>Order Placed Successfully!</h2>
        <p class="message">
            Thank you for choosing ABC Cafe.<br>
            Your order has been confirmed!
        </p>
        <p class="info">
            We appreciate your order and look forward to serving you.
        </p>
        <a href="home.html" class="button">Back to Home</a>
    </div>

    <footer>
        <h3>Follow Us</h3>
        <div class="social">
            <a href="https://www.instagram.com/?hl=en" target="_blank">📸 Instagram</a>
            <a href="https://www.facebook.com/" target="_blank">📘 Facebook</a>
            <a href="https://www.snapchat.com/" target="_blank">👻 Snapchat</a>
        </div>

        <p>© 2026 ABC Cafe | All Rights Reserved</p>
    </footer>

</body>
</html>
